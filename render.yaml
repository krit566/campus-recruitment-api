# One-click deploy on Render: New + > Blueprint > pick this repo.
# Creates a Postgres database, the API and the web app. The web app forwards /api/* to the API, so the API's URL
# below must match the API service's real address (Render shows it after the first deploy; edit it if it differs).
# Free-tier notes: the database expires after 30 days, the API sleeps when idle (the first request takes about a
# minute), and there is no persistent disk, so uploaded resumes are lost on restart (use object storage for real use).
databases:
  - name: placeright-db
    plan: free
    databaseName: placeright
    user: placeright

services:
  - type: web
    name: placeright-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DATABASE_URL
        fromDatabase:
          name: placeright-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RECRUIT_OFFICER_EMAIL
        sync: false # set in the dashboard
      - key: RECRUIT_OFFICER_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads

  - type: web
    name: placeright-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://placeright-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
