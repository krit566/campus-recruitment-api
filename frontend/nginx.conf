server {
    listen 80;
    root /usr/share/nginx/html;

    # resumes are at most 2 MB; leave a little room for the multipart envelope
    client_max_body_size 3m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # /api/... goes to the FastAPI container without the /api prefix (same origin: no CORS needed)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    # hashed asset files never change, so browsers may cache them for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # single-page app: unknown paths (e.g. /officer/jobs/3) load index.html and React Router takes over
    location / {
        try_files $uri /index.html;
    }
}
